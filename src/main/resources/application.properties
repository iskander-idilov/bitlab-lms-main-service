spring.application.name=main-service

spring.datasource.url=jdbc:postgresql://localhost:5432/lms_main
spring.datasource.username=${DB_USERNAME:lms_user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

logging.level.kz.bitlab.springboot.mainservice=DEBUG

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/bitlab-lms

keycloak.token-uri=http://localhost:8081/realms/bitlab-lms/protocol/openid-connect/token
keycloak.client-id=main-service
keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET}
keycloak.admin-users-uri=http://localhost:8081/admin/realms/bitlab-lms/users

minio.url=http://localhost:9000
minio.access-key=${MINIO_ROOT_USER}
minio.secret-key=${MINIO_ROOT_PASSWORD}
minio.bucket-name=dev-bucket

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
# Части multipart-запроса сразу пишутся на диск, а не буферизуются в памяти JVM,
# чтобы параллельные загрузки не создавали нагрузку на heap.
spring.servlet.multipart.file-size-threshold=0
spring.servlet.multipart.location=${MULTIPART_TEMP_DIR:${java.io.tmpdir}/main-service-uploads}
